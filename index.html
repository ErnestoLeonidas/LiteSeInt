<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiteSeInt — Intérprete de Pseudocódigo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ========================================
       CSS VARIABLES & THEME
       ======================================== */
    :root {
      --bg-deep: #0a0e14;
      --bg-panel: #0d1117;
      --bg-editor: #0f1319;
      --bg-console: #080b10;
      --border-color: #1a2332;
      --accent: #00ff88;
      --accent-dim: #00cc6a;
      --accent-bg: #00ff8810;
      --text-primary: #c8d6e5;
      --text-secondary: #5c6a7a;
      --text-muted: #3a4555;
      --line-number: #2a3545;
      --error: #ff4757;
      --danger: #ff6b6b;
      --danger-dim: #ee5a5a;
      --warning: #ffa502;
      --info: #70a1ff;
      --exec-highlight: #b8f0c8;
      --exec-highlight-bg: rgba(184, 240, 200, 0.16);
      --error-highlight-bg: rgba(255, 71, 87, 0.16);
      --syntax-keyword: #ff6b9d;
      --syntax-string: #ffd43b;
      --syntax-variable: #70a1ff;
      --syntax-comment: #5c6a7a;
      --syntax-number: #a8e6cf;
      --syntax-assign: #c8d6e5;
      --font-code: 'JetBrains Mono', 'Space Mono', monospace;
      --line-height-val: 1.65;
      --line-px: 21.45px;
      --header-h: 52px;
      --toolbar-h: 44px;
      --example-bar-h: 32px;
      --footer-h: 32px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-code);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    /* Full-page flex layout */
    .app-shell {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; width: 100vw; overflow: hidden;
    }

    /* ========================================
       HEADER
       ======================================== */
    .app-header {
      flex-shrink: 0;
      height: var(--header-h);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(180deg, rgba(0,255,136,0.03) 0%, transparent 100%);
    }

    .app-logo { display: flex; align-items: center; gap: 12px; }

    .app-logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, #00aa55 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: var(--bg-deep);
      box-shadow: 0 0 20px rgba(0,255,136,0.25);
    }

    .app-logo-text { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
    .app-logo-text span { color: var(--accent); }

    .app-version {
      font-size: 10px; color: var(--text-secondary);
      background: var(--accent-bg); border: 1px solid var(--border-color);
      padding: 2px 8px; border-radius: 20px; letter-spacing: 0.5px;
    }

    /* ========================================
       TOOLBAR — centered buttons
       ======================================== */
    .toolbar {
      flex-shrink: 0;
      height: var(--toolbar-h);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(13, 17, 23, 0.8);
      position: relative;
    }

    .toolbar-center {
      display: flex; align-items: center; gap: 10px;
    }

    .toolbar-right {
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 6px;
    }

    .btn-exec {
      background: linear-gradient(135deg, var(--accent) 0%, #00cc6a 100%);
      color: var(--bg-deep); border: none; padding: 7px 18px; border-radius: 6px;
      font-family: var(--font-code); font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px;
    }
    .btn-exec:hover { box-shadow: 0 0 20px rgba(0,255,136,0.35); transform: translateY(-1px); }
    .btn-exec:active { transform: translateY(0); }
    .btn-exec:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-stop {
      background: linear-gradient(135deg, var(--danger) 0%, var(--danger-dim) 100%);
      color: #fff; border: none; padding: 7px 16px; border-radius: 6px;
      font-family: var(--font-code); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px;
    }
    .btn-stop:hover { box-shadow: 0 0 16px rgba(255,107,107,0.4); transform: translateY(-1px); }
    .btn-stop:active { transform: translateY(0); }

    .btn-secondary {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border-color); padding: 7px 14px; border-radius: 6px;
      font-family: var(--font-code); font-size: 11.5px;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-secondary:hover {
      border-color: var(--text-secondary); color: var(--text-primary);
      background: rgba(255,255,255,0.03);
    }

    .toolbar-separator { width: 1px; height: 24px; background: var(--border-color); margin: 0 4px; }

    .status-indicator {
      font-size: 11px; color: var(--text-secondary);
      display: flex; align-items: center; gap: 6px;
    }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-secondary); transition: background 0.3s;
    }
    .status-dot.running {
      background: var(--accent); box-shadow: 0 0 8px rgba(0,255,136,0.6);
      animation: pulse 1s infinite;
    }
    .status-dot.error { background: var(--error); box-shadow: 0 0 8px rgba(255,71,87,0.6); }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ========================================
       MAIN LAYOUT
       ======================================== */
    .main-container {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* ========================================
       EDITOR PANEL
       ======================================== */
    .editor-panel {
      flex: 1; display: flex; flex-direction: column;
      border-right: 1px solid var(--border-color); min-width: 0;
    }

    .panel-header {
      flex-shrink: 0;
      padding: 7px 16px; font-size: 10.5px; font-weight: 500;
      color: var(--text-secondary); letter-spacing: 1.5px; text-transform: uppercase;
      border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2);
      display: flex; align-items: center; gap: 8px;
    }
    .panel-header-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-dim); }

    .editor-wrapper { flex: 1; display: flex; overflow: hidden; position: relative; min-height: 0; }

    .editor-code-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ---- Gutter ---- */
    .line-numbers {
      width: 58px; padding: 16px 0;
      background: rgba(0,0,0,0.15); border-right: 1px solid var(--border-color);
      font-size: 13px; color: var(--line-number); line-height: var(--line-height-val);
      overflow: hidden; user-select: none; flex-shrink: 0;
    }

    .line-num-row {
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 8px; height: var(--line-px); position: relative;
      transition: background 0.15s, color 0.15s;
    }
    .line-num-row .exec-arrow {
      display: none;
      font-size: 11px;
      font-weight: 700;
      margin-right: 2px;
      flex-shrink: 0;
    }
    .line-num-row.executing .exec-arrow {
      display: inline;
      color: var(--accent);
    }
    .line-num-row.has-error .exec-arrow {
      display: inline;
      color: var(--error);
    }
    .line-num-row .num-text { width: 24px; text-align: right; }

    .line-num-row.executing { background: var(--exec-highlight-bg); color: var(--exec-highlight); }

    /* Error badge */
    .error-badge-container {
      display: none;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      pointer-events: auto;
    }
    .line-overlay.has-error .error-badge-container { display: flex; }

    .error-badge-btn {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid var(--error); background: transparent;
      color: var(--error); font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0; line-height: 1; transition: all 0.2s;
    }
    .error-badge-btn:hover { background: var(--error); color: #fff; }

    /* ---- Line overlays ---- */
    .editor-line-overlays {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; padding-top: 16px; z-index: 1; overflow: hidden;
    }
    .line-overlay {
      height: var(--line-px); width: 100%; transition: background 0.15s;
      position: relative;
    }
    .line-overlay.executing { background: var(--exec-highlight-bg); }
    .line-overlay.has-error { background: var(--error-highlight-bg); }

    /* ---- Textarea ---- */
    #editor {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: transparent; color: transparent;
      border: none; outline: none; padding: 16px;
      font-family: var(--font-code); font-size: 13px; line-height: var(--line-height-val);
      resize: none; tab-size: 2; white-space: pre;
      overflow-wrap: normal; overflow-x: auto;
      z-index: 4; margin: 0; width: 100%; height: 100%;
      caret-color: var(--accent);
    }
    #editor::placeholder { color: var(--text-muted); }
    #editor:placeholder-shown { color: var(--text-muted); }

    .editor-bg-layer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-editor); z-index: 0;
    }

    /* Syntax highlight layer */
    .syntax-highlight-layer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      padding: 16px; z-index: 3; pointer-events: none;
      font-family: var(--font-code); font-size: 13px;
      line-height: var(--line-height-val);
      white-space: pre; overflow: hidden;
      color: transparent;
      margin: 0; border: none;
    }

    .syntax-highlight-layer .sh-keyword { color: var(--syntax-keyword); }
    .syntax-highlight-layer .sh-string { color: var(--syntax-string); }
    .syntax-highlight-layer .sh-variable { color: var(--syntax-variable); }
    .syntax-highlight-layer .sh-comment { color: var(--syntax-comment); opacity: 0.8; }
    .syntax-highlight-layer .sh-number { color: var(--syntax-number); }
    .syntax-highlight-layer .sh-operator { color: var(--text-secondary); }
    .syntax-highlight-layer .sh-assign { color: var(--syntax-assign); }
    .syntax-highlight-layer .sh-plain { color: var(--text-primary); }

    /* ---- Error decoration layer (underlines) ---- */
    .error-decoration-layer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      padding: 16px; z-index: 2; pointer-events: none;
      font-family: var(--font-code); font-size: 13px;
      line-height: var(--line-height-val);
      white-space: pre; overflow: hidden;
      color: transparent;
      margin: 0; border: none;
    }

    .error-underline {
      text-decoration: wavy underline var(--error);
      text-decoration-skip-ink: none;
      text-underline-offset: 2px;
      color: transparent;
    }

    /* ========================================
       CONSOLE PANEL
       ======================================== */
    .console-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .console-header {
      flex-shrink: 0;
      padding: 7px 16px; font-size: 10.5px; font-weight: 500;
      color: var(--text-secondary); letter-spacing: 1.5px; text-transform: uppercase;
      border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2);
      display: flex; align-items: center; gap: 8px;
    }

    .console-header-actions { margin-left: auto; }

    .btn-console-clear {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border-color); padding: 2px 10px; border-radius: 4px;
      font-family: var(--font-code); font-size: 10px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      letter-spacing: 0.5px; text-transform: none;
    }
    .btn-console-clear:hover {
      border-color: var(--text-secondary); color: var(--text-primary);
      background: rgba(255,255,255,0.03);
    }

    #consola {
      flex: 1; background: var(--bg-console); padding: 16px;
      overflow-y: auto; font-family: var(--font-code); font-size: 13px; line-height: 1.7;
    }
    #consola::-webkit-scrollbar { width: 6px; }
    #consola::-webkit-scrollbar-track { background: transparent; }
    #consola::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

    .console-line { padding: 2px 0; animation: fadeInLine 0.15s ease; }

    @keyframes fadeInLine {
      from { opacity: 0; transform: translateX(-5px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .console-line.output { color: var(--text-primary); }
    .console-line.output::before { content: '› '; color: var(--accent-dim); }
    .console-line.system { color: var(--text-secondary); font-style: italic; font-size: 12px; }
    .console-line.error { color: var(--error); }
    .console-line.error::before { content: '✕ '; }
    .console-line.input-echo { color: var(--text-secondary); font-size: 12px; }

    /* Inline input in console */
    .console-input-row {
      display: flex; align-items: center; gap: 8px; padding: 6px 0;
      animation: fadeInLine 0.15s ease;
    }
    .console-input-row .prompt-symbol { color: var(--warning); font-weight: 600; flex-shrink: 0; }
    .console-input-row .var-label { color: var(--accent); font-size: 12px; flex-shrink: 0; }

    .console-input-field {
      flex: 1; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-color); border-radius: 4px;
      color: var(--text-primary); padding: 5px 10px;
      font-family: var(--font-code); font-size: 13px;
      outline: none; transition: border-color 0.2s; min-width: 0;
    }
    .console-input-field:focus {
      border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,255,136,0.1);
    }

    .console-input-send {
      background: linear-gradient(135deg, var(--accent) 0%, #00cc6a 100%);
      color: var(--bg-deep); border: none; padding: 5px 12px; border-radius: 4px;
      font-family: var(--font-code); font-size: 12px; font-weight: 600;
      cursor: pointer; flex-shrink: 0; transition: box-shadow 0.2s;
    }
    .console-input-send:hover { box-shadow: 0 0 12px rgba(0,255,136,0.3); }

    /* ========================================
       AUTOCOMPLETE
       ======================================== */
    .autocomplete-dropdown {
      display: none; position: absolute; background: var(--bg-panel);
      border: 1px solid var(--border-color); border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4); z-index: 500;
      max-height: 180px; overflow-y: auto; min-width: 160px;
    }
    .autocomplete-dropdown.visible { display: block; }

    .autocomplete-item {
      padding: 6px 14px; font-size: 12px; font-family: var(--font-code);
      color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; gap: 8px;
    }
    .autocomplete-item:hover,
    .autocomplete-item.selected { background: var(--accent-bg); color: var(--accent); }

    .autocomplete-item .kw-badge {
      font-size: 9px; padding: 1px 5px; border-radius: 3px;
      background: rgba(255,255,255,0.05); color: var(--text-secondary);
      letter-spacing: 0.5px;
    }

    /* ========================================
       EXAMPLES BAR
       ======================================== */
    .example-bar {
      flex-shrink: 0;
      height: var(--example-bar-h);
      padding: 0 16px;
      border-top: 1px solid var(--border-color);
      background: rgba(0,0,0,0.15); display: flex; align-items: center;
      gap: 8px; flex-wrap: nowrap; overflow: hidden;
    }
    .example-bar span {
      font-size: 10px; color: var(--text-muted);
      letter-spacing: 1px; text-transform: uppercase;
      flex-shrink: 0;
    }
    .example-btn {
      font-size: 11px; padding: 2px 10px; background: transparent;
      border: 1px solid var(--border-color); color: var(--text-secondary);
      border-radius: 4px; cursor: pointer; font-family: var(--font-code);
      transition: all 0.2s; flex-shrink: 0;
    }
    .example-btn:hover {
      border-color: var(--accent-dim); color: var(--accent); background: var(--accent-bg);
    }

    /* ========================================
       FOOTER
       ======================================== */
    .app-footer {
      flex-shrink: 0;
      height: var(--footer-h);
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border-color);
      background: rgba(0,0,0,0.15);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .app-footer .heart { color: var(--error); margin: 0 4px; font-size: 11px; }

    /* ========================================
       TOOLTIP OVERRIDE (Bootstrap dark)
       ======================================== */
    .tooltip-inner {
      background: #1a1a2e !important; border: 1px solid var(--error);
      color: var(--error) !important; font-family: var(--font-code);
      font-size: 11px; max-width: 300px; text-align: left; padding: 6px 10px;
      white-space: pre-line;
    }
    .tooltip .tooltip-arrow::before { border-top-color: var(--error) !important; }
    .bs-tooltip-end .tooltip-arrow::before { border-right-color: var(--error) !important; }
    .bs-tooltip-start .tooltip-arrow::before { border-left-color: var(--error) !important; }

    /* ========================================
       RESPONSIVE
       ======================================== */
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .editor-panel, .console-panel { min-height: 35vh; flex: none; border-right: none; }
      .editor-panel { border-bottom: 1px solid var(--border-color); flex: 1; }
      .console-panel { flex: 1; }
      .toolbar { flex-wrap: wrap; height: auto; padding: 8px 16px; }
      .toolbar-right { position: static; transform: none; }
    }
  </style>
</head>
<body>

  <div class="app-shell">

    <!-- ========== HEADER ========== -->
    <header class="app-header">
      <div class="app-logo">
        <div class="app-logo-icon">L</div>
        <div class="app-logo-text">Lite<span>SeInt</span></div>
      </div>
      <div class="app-version">v2.0</div>
    </header>

    <!-- ========== TOOLBAR ========== -->
    <div class="toolbar">
      <div class="toolbar-center">
        <button class="btn-exec" id="btnEjecutar">▶ Ejecutar</button>
        <button class="btn-stop" id="btnDetener" style="display:none;">◼ Detener</button>
        <div class="toolbar-separator"></div>
        <button class="btn-secondary" id="btnLimpiarTodo">✕ Limpiar todo</button>
      </div>
      <div class="toolbar-right">
        <div class="status-indicator">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Listo</span>
        </div>
      </div>
    </div>

    <!-- ========== MAIN ========== -->
    <div class="main-container">
      <!-- Editor -->
      <div class="editor-panel">
        <div class="panel-header">
          <div class="panel-header-dot"></div>
          Editor de pseudocódigo
        </div>
        <div class="editor-wrapper">
          <div class="line-numbers" id="lineNumbers"></div>
          <div class="editor-code-area">
            <div class="editor-bg-layer"></div>
            <div class="editor-line-overlays" id="lineOverlays"></div>
            <div class="error-decoration-layer" id="errorDecoLayer"></div>
            <div class="syntax-highlight-layer" id="syntaxLayer"></div>
            <textarea
              id="editor"
              spellcheck="false"
              placeholder="Escribe tu pseudocódigo aquí...

Ejemplo:
  Definir nombre, apellido Como Caracter
  Escribir &quot;¿Cómo te llamas?&quot;
  Leer nombre
  Escribir &quot;Hola, &quot;, nombre"
            ></textarea>
          </div>
          <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
        </div>
        <div class="example-bar">
          <span>Ejemplos:</span>
          <button class="example-btn" data-ejemplo="hola">Hola Mundo</button>
          <button class="example-btn" data-ejemplo="saludo">Saludo</button>
          <button class="example-btn" data-ejemplo="notas">Notas</button>
          <button class="example-btn" data-ejemplo="multivar">Multi-variable</button>
        </div>
      </div>

      <!-- Consola -->
      <div class="console-panel">
        <div class="console-header">
          <div class="panel-header-dot" style="background: var(--info);"></div>
          Consola de salida
          <div class="console-header-actions">
            <button class="btn-console-clear" id="btnLimpiarConsola">⌫ Limpiar</button>
          </div>
        </div>
        <div id="consola"></div>
      </div>
    </div>

    <!-- ========== FOOTER ========== -->
    <footer class="app-footer">
      Desarrollado con<span class="heart">♥</span>por ernesto velásquez
    </footer>

  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="doc_errores.js"></script>
  <script src="LiteSeInt.js"></script>
  <script>
    /* ==============================================
       UI Controller — Conecta LiteSeInt con la interfaz
       ============================================== */

    // =========================================
    // 1. STATE MANAGEMENT
    // =========================================

    let inputResolver = null;

    /**
     * Estado visual de errores — separado del estado de edición.
     * Se activa SOLO al presionar Ejecutar.
     * Se invalida inmediatamente al editar.
     */
    let errorVisualState = {
      activo: false,                 // true = hay errores pintados en el editor
      erroresPorLinea: null,         // Map<lineaIdx, Array<error>>
      erroresMapa: {},               // lineaIdx -> mensajes concatenados (para badges)
    };

    function resetErrorVisualState() {
      errorVisualState.activo = false;
      errorVisualState.erroresPorLinea = null;
      errorVisualState.erroresMapa = {};
    }

    // =========================================
    // 2. INTÉRPRETE
    // =========================================

    const interprete = new LiteSeInt({

      onEscribir(texto) {
        consolaImprimir(texto, 'output');
      },

      onLeer(nombreVar) {
        return new Promise((resolve) => {
          inputResolver = resolve;
          mostrarInputConsola(nombreVar);
        });
      },

      onError(lineaIdx, mensaje) {
        // Runtime errors: add to visual state and paint immediately
        if (!errorVisualState.erroresMapa[lineaIdx]) {
          errorVisualState.erroresMapa[lineaIdx] = mensaje;
        } else {
          errorVisualState.erroresMapa[lineaIdx] += '\n' + mensaje;
        }
        consolaImprimir(`Error en línea ${lineaIdx + 1}: ${mensaje}`, 'error');
        marcarErrorLinea(lineaIdx, errorVisualState.erroresMapa[lineaIdx]);
        errorVisualState.activo = true;
      },

      onLineaActiva(lineaIdx) {
        resaltarLineaEjecutando(lineaIdx);
      },

      onSistema(texto) {
        consolaImprimir(texto, 'input-echo');
      },

      onFin() { /* handled in ejecutar() */ },
    });

    // =========================================
    // 3. CONSOLA
    // =========================================

    function consolaImprimir(texto, tipo = 'output') {
      $('#consola').append(
        $('<div>').addClass(`console-line ${tipo}`).text(texto)
      );
      scrollConsola();
    }

    function scrollConsola() {
      const el = document.getElementById('consola');
      el.scrollTop = el.scrollHeight;
    }

    /**
     * Limpiar consola: vacía la consola Y limpia errores visuales del editor.
     */
    function limpiarConsola() {
      $('#consola').empty();
      invalidarErroresVisuales();
    }

    function limpiarTodo() {
      $('#editor').val('');
      limpiarConsola();
      actualizarLineas();
    }

    // =========================================
    // 4. INPUT INLINE EN CONSOLA
    // =========================================

    function mostrarInputConsola(nombreVar) {
      const $row = $('<div>').addClass('console-input-row');
      $row.html(`
        <span class="prompt-symbol">?</span>
        <span class="var-label">${nombreVar}:</span>
        <input type="text" class="console-input-field" id="consolaInputField"
               placeholder="Escribe un valor..." autocomplete="off" />
        <button class="console-input-send" id="consolaInputBtn">↵</button>
      `);

      $('#consola').append($row);
      scrollConsola();
      setTimeout(() => $('#consolaInputField').focus(), 50);

      $row.find('#consolaInputField').on('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); confirmarInputConsola($row); }
      });
      $row.find('#consolaInputBtn').on('click', () => confirmarInputConsola($row));
    }

    function confirmarInputConsola($row) {
      const valor = $row.find('#consolaInputField').val();
      $row.replaceWith(
        $('<div>').addClass('console-line input-echo').text(`  ↳ entrada: ${valor}`)
      );
      if (inputResolver) {
        const resolver = inputResolver;
        inputResolver = null;
        resolver(valor);
      }
    }

    // =========================================
    // 5. ERROR VISUAL SYSTEM
    //    - Only activated by Ejecutar
    //    - Invalidated immediately on any edit
    //    - Separate from execution highlight
    // =========================================

    /**
     * Clears ALL visual error indicators from the editor.
     */
    function invalidarErroresVisuales() {
      resetErrorVisualState();

      // Clear gutter and overlay error classes
      $('.line-num-row').removeClass('has-error');
      $('.line-overlay').removeClass('has-error');

      // Dispose all error tooltips
      $('.error-badge-btn').each(function() {
        const tip = bootstrap.Tooltip.getInstance(this);
        if (tip) tip.dispose();
      });

      // Clear underline layer
      document.getElementById('errorDecoLayer').innerHTML = '';
    }

    /**
     * Clears only execution highlights (green line indicator).
     * Independent from error visual state.
     */
    function limpiarEjecucionHighlight() {
      $('.line-num-row.executing').removeClass('executing');
      $('.line-overlay.executing').removeClass('executing');
    }

    /**
     * Applies visual error state to the editor.
     * Called ONLY from the ejecutar() flow.
     */
    function aplicarErroresVisuales(erroresPorLinea) {
      invalidarErroresVisuales();

      errorVisualState.activo = true;
      errorVisualState.erroresPorLinea = erroresPorLinea;

      for (const [lineaIdx, erroresLinea] of erroresPorLinea) {
        const mensajes = erroresLinea.map(e => e.mensaje).join('\n');
        errorVisualState.erroresMapa[lineaIdx] = mensajes;
        marcarErrorLinea(lineaIdx, mensajes);
      }

      renderizarSubrayados();
    }

    /**
     * Mark a single line with error badge + tooltip.
     */
    function marcarErrorLinea(lineaIdx, mensaje) {
      const $row = $(`.line-num-row[data-line="${lineaIdx}"]`);
      $row.addClass('has-error').removeClass('executing');

      const $overlay = $(`.line-overlay[data-line="${lineaIdx}"]`);
      $overlay.removeClass('executing').addClass('has-error');

      const $btn = $overlay.find('.error-badge-btn');
      $btn.attr('title', mensaje);

      const existing = bootstrap.Tooltip.getInstance($btn[0]);
      if (existing) existing.dispose();
      new bootstrap.Tooltip($btn[0], { placement: 'left', trigger: 'hover focus', html: false });
    }

    /**
     * Renders wavy red underlines from the current error visual state.
     */
    function renderizarSubrayados() {
      const texto = $('#editor').val();
      const lineas = texto.split('\n');
      const errPorLinea = errorVisualState.erroresPorLinea;

      if (!errPorLinea || errPorLinea.size === 0) {
        document.getElementById('errorDecoLayer').innerHTML = lineas.map(() => '').join('\n');
        return;
      }

      const htmlLines = lineas.map((linea, idx) => {
        const erroresLinea = errPorLinea.get(idx);
        if (!erroresLinea || erroresLinea.length === 0) {
          return ' '.repeat(linea.length);
        }
        return renderErrorUnderlines(linea, erroresLinea);
      });

      document.getElementById('errorDecoLayer').innerHTML = htmlLines.join('\n');
    }

    function renderErrorUnderlines(linea, errores) {
      if (linea.length === 0) return '';

      const errorMap = new Array(linea.length).fill(false);
      for (const err of errores) {
        const start = Math.max(0, err.columnaInicio);
        const end = Math.min(linea.length, err.columnaFin);
        for (let i = start; i < end; i++) {
          errorMap[i] = true;
        }
      }

      let result = '';
      let i = 0;
      while (i < linea.length) {
        const isError = errorMap[i];
        let j = i;
        while (j < linea.length && errorMap[j] === isError) j++;

        const segment = escapeHtml(linea.substring(i, j));
        if (isError) {
          result += `<span class="error-underline">${segment}</span>`;
        } else {
          result += segment;
        }
        i = j;
      }

      return result;
    }

    // =========================================
    // 6. LINE NUMBERS + OVERLAYS
    // =========================================

    function actualizarLineas() {
      const texto = $('#editor').val();
      const numLineas = texto.split('\n').length;
      const total = Math.max(numLineas, 10);  // mínimo 10 líneas
      const $gutter = $('#lineNumbers');
      const $overlays = $('#lineOverlays');

      $gutter.empty();
      $overlays.empty();

      for (let i = 0; i < total; i++) {
        const $row = $('<div>').addClass('line-num-row').attr('data-line', i);
        $row.append($('<span>').addClass('exec-arrow').text('>'));
        $row.append($('<span>').addClass('num-text').text(i + 1));
        $gutter.append($row);

        const $overlay = $('<div>').addClass('line-overlay').attr('data-line', i);
        $overlay.append(
          $('<div>').addClass('error-badge-container').html(
            `<button class="error-badge-btn" data-line="${i}" tabindex="-1">!</button>`
          )
        );
        $overlays.append($overlay);
      }

      // Re-apply error visual state if still active (e.g. after line count rebuild)
      if (errorVisualState.activo) {
        for (const [idx, msg] of Object.entries(errorVisualState.erroresMapa)) {
          marcarErrorLinea(parseInt(idx), msg);
        }
      }

      actualizarSyntaxHighlight();
    }

    function resaltarLineaEjecutando(lineaIdx) {
      $('.line-num-row.executing').removeClass('executing');
      $('.line-overlay.executing').removeClass('executing');
      $(`.line-num-row[data-line="${lineaIdx}"]`).addClass('executing');
      $(`.line-overlay[data-line="${lineaIdx}"]`).addClass('executing');
    }

    // Sync scroll
    $('#editor').on('scroll', function() {
      const st = this.scrollTop;
      const sl = this.scrollLeft;
      document.getElementById('lineNumbers').scrollTop = st;
      document.getElementById('lineOverlays').scrollTop = st;
      document.getElementById('syntaxLayer').scrollTop = st;
      document.getElementById('syntaxLayer').scrollLeft = sl;
      document.getElementById('errorDecoLayer').scrollTop = st;
      document.getElementById('errorDecoLayer').scrollLeft = sl;
    });

    // =========================================
    // 7. SYNTAX HIGHLIGHTING (always real-time)
    // =========================================

    function actualizarSyntaxHighlight() {
      const texto = $('#editor').val();
      const lineas = texto.split('\n');
      const userVars = DocErrores.extraerVariablesDelCodigo(texto);
      const userVarsSet = new Set(userVars.map(v => v.toLowerCase()));

      const htmlLines = lineas.map(linea => resaltarLinea_syntax(linea, userVarsSet));
      document.getElementById('syntaxLayer').innerHTML = htmlLines.join('\n');
    }

    function resaltarLinea_syntax(linea, userVarsSet) {
      if (linea === '') return '';

      const tokens = DocErrores.tokenizarLinea(linea);
      let result = '';

      for (const tk of tokens) {
        const escaped = escapeHtml(tk.value);
        switch (tk.type) {
          case DocErrores.TK.KEYWORD:
            result += `<span class="sh-keyword">${escaped}</span>`;
            break;
          case DocErrores.TK.STRING:
          case DocErrores.TK.STRING_UNCLOSED:
            result += `<span class="sh-string">${escaped}</span>`;
            break;
          case DocErrores.TK.NUMBER:
            result += `<span class="sh-number">${escaped}</span>`;
            break;
          case DocErrores.TK.COMMENT:
            result += `<span class="sh-comment">${escaped}</span>`;
            break;
          case DocErrores.TK.ASSIGN:
            result += `<span class="sh-assign">${escaped}</span>`;
            break;
          case DocErrores.TK.OPERATOR:
            result += `<span class="sh-operator">${escaped}</span>`;
            break;
          case DocErrores.TK.IDENTIFIER:
            if (userVarsSet.has(tk.value.toLowerCase())) {
              result += `<span class="sh-variable">${escaped}</span>`;
            } else {
              result += `<span class="sh-plain">${escaped}</span>`;
            }
            break;
          default:
            result += `<span class="sh-plain">${escaped}</span>`;
            break;
        }
      }

      return result;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // =========================================
    // 8. AUTOCOMPLETE
    // =========================================

    let acIndice = -1;

    /**
     * On input: update syntax highlighting, autocomplete,
     * and INVALIDATE error visuals if they are active.
     */
    $('#editor').on('input', function() {
      if (errorVisualState.activo) {
        invalidarErroresVisuales();
      }
      actualizarLineas();
      mostrarAutocompletado();
    });

    // Handle paste
    $('#editor').on('paste', function() {
      setTimeout(() => {
        if (errorVisualState.activo) {
          invalidarErroresVisuales();
        }
        actualizarLineas();
      }, 10);
    });

    $('#editor').on('keydown', function(e) {
      const $dd = $('#autocompleteDropdown');
      const visible = $dd.hasClass('visible');

      if (visible) {
        const items = $dd.find('.autocomplete-item');
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          acIndice = Math.min(acIndice + 1, items.length - 1);
          actualizarSeleccionAC(items); return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          acIndice = Math.max(acIndice - 1, 0);
          actualizarSeleccionAC(items); return;
        }
        if (e.key === 'Tab' || e.key === 'Enter') {
          if (acIndice >= 0 && acIndice < items.length) {
            e.preventDefault();
            insertarAutocompletado($(items[acIndice]).data('texto'));
            ocultarAutocompletado(); return;
          }
        }
        if (e.key === 'Escape') { ocultarAutocompletado(); return; }
      }

      if (e.key === 'Tab' && !visible) {
        e.preventDefault();
        const s = this.selectionStart, en = this.selectionEnd;
        const v = $(this).val();
        $(this).val(v.substring(0, s) + '  ' + v.substring(en));
        this.selectionStart = this.selectionEnd = s + 2;
        actualizarLineas();
      }
    });

    function mostrarAutocompletado() {
      const editor = document.getElementById('editor');
      const cur = editor.selectionStart;
      const txt = editor.value;

      const textBefore = txt.substring(0, cur);
      const lastNewline = textBefore.lastIndexOf('\n');
      const lineUpToCursor = textBefore.substring(lastNewline + 1);

      const colInLine = lineUpToCursor.length;
      const fullLine = txt.split('\n')[textBefore.split('\n').length - 1] || '';
      const context = DocErrores.cursorContext(fullLine, colInLine - 1);

      if (context.inString || context.inComment) {
        ocultarAutocompletado();
        return;
      }

      let ini = cur - 1;
      while (ini >= 0 && /[\wáéíóúüñÁÉÍÓÚÜÑ]/.test(txt[ini])) ini--;
      ini++;
      const palabra = txt.substring(ini, cur);

      if (palabra.length < 2) { ocultarAutocompletado(); return; }

      const userVars = DocErrores.extraerVariablesDelCodigo(txt).map(v => ({
        texto: v, tipo: 'variable'
      }));
      const todas = [...LiteSeInt.PALABRAS_RESERVADAS, ...userVars];

      const matches = todas.filter(p =>
        p.texto.toLowerCase().startsWith(palabra.toLowerCase()) &&
        p.texto.toLowerCase() !== palabra.toLowerCase()
      );

      const seen = new Set();
      const unique = matches.filter(m => {
        const key = m.texto.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      if (!unique.length) { ocultarAutocompletado(); return; }

      const $dd = $('#autocompleteDropdown').empty();
      acIndice = 0;

      unique.forEach((item, idx) => {
        const $it = $('<div>').addClass('autocomplete-item')
          .attr('data-texto', item.texto)
          .html(`<span>${item.texto}</span><span class="kw-badge">${item.tipo}</span>`)
          .on('click', () => { insertarAutocompletado(item.texto); ocultarAutocompletado(); });
        if (idx === 0) $it.addClass('selected');
        $dd.append($it);
      });

      posicionarDropdown(cur);
      $dd.addClass('visible');
    }

    function posicionarDropdown(cursorPos) {
      const editor = document.getElementById('editor');
      const $dd = $('#autocompleteDropdown');
      const txt = editor.value.substring(0, cursorPos);
      const lineas = txt.split('\n');
      const lnIdx = lineas.length - 1;
      const col = lineas[lineas.length - 1].length;
      const wr = document.querySelector('.editor-wrapper').getBoundingClientRect();

      const top = (lnIdx + 1) * 21.45 + 16 - editor.scrollTop;
      const left = col * 7.8 + 58 + 16 - editor.scrollLeft;

      $dd.css({
        top: Math.min(top, wr.height - 190) + 'px',
        left: Math.min(left, wr.width - 170) + 'px'
      });
    }

    function insertarAutocompletado(palabra) {
      const editor = document.getElementById('editor');
      const cur = editor.selectionStart;
      const txt = editor.value;

      let ini = cur - 1;
      while (ini >= 0 && /[\wáéíóúüñÁÉÍÓÚÜÑ]/.test(txt[ini])) ini--;
      ini++;

      editor.value = txt.substring(0, ini) + palabra + ' ' + txt.substring(cur);
      const pos = ini + palabra.length + 1;
      editor.selectionStart = editor.selectionEnd = pos;
      editor.focus();
      actualizarLineas();
    }

    function actualizarSeleccionAC(items) {
      items.removeClass('selected');
      $(items[acIndice]).addClass('selected');
    }

    function ocultarAutocompletado() {
      $('#autocompleteDropdown').removeClass('visible');
      acIndice = -1;
    }

    $(document).on('click', function(e) {
      if (!$(e.target).closest('#editor, #autocompleteDropdown').length) ocultarAutocompletado();
    });

    // =========================================
    // 9. CONTROLES PRINCIPALES
    // =========================================

    function setEstado(estado, texto) {
      $('#statusDot').removeClass('running error').addClass(estado);
      $('#statusText').text(texto);
    }

    async function ejecutar() {
      if (interprete.ejecutando) return;

      // Clean everything
      limpiarConsola();          // also calls invalidarErroresVisuales()
      limpiarEjecucionHighlight();
      actualizarLineas();

      const codigo = $('#editor').val();
      if (codigo.trim() === '') return;

      // Step 1: Static validation via doc_errores.js
      const validacion = DocErrores.validarDocumento(codigo);

      if (validacion.errores.length > 0) {
        // Show all errors in console
        for (const err of validacion.errores) {
          consolaImprimir(`Error en línea ${err.linea + 1}: ${err.mensaje}`, 'error');
        }
        // Paint error visuals
        aplicarErroresVisuales(validacion.erroresPorLinea);
        setEstado('error', 'Error');
        return;
      }

      // Step 2: Execute
      setEstado('running', 'Ejecutando...');
      $('#btnEjecutar').prop('disabled', true);
      $('#btnDetener').show();

      consolaImprimir('Inicio de ejecución', 'system');

      const resultado = await interprete.ejecutar(codigo);

      if (resultado.exito) {
        consolaImprimir('Fin de ejecución', 'system');
        setEstado('', 'Listo');
      } else {
        setEstado('error', 'Error');
        // Runtime errors already painted via onError callback.
        // If structured errors exist, also render underlines
        if (resultado.erroresPorLinea && resultado.erroresPorLinea.size > 0) {
          errorVisualState.erroresPorLinea = resultado.erroresPorLinea;
          renderizarSubrayados();
        }
      }

      limpiarEjecucionHighlight();
      $('#btnEjecutar').prop('disabled', false);
      $('#btnDetener').hide();
    }

    function detener() {
      interprete.detener();
      if (inputResolver) { const r = inputResolver; inputResolver = null; r(''); }
      consolaImprimir('Ejecución detenida por el usuario.', 'system');
      setEstado('', 'Detenido');
      $('#btnEjecutar').prop('disabled', false);
      $('#btnDetener').hide();
      limpiarEjecucionHighlight();
    }

    // =========================================
    // 10. EJEMPLOS
    // =========================================

    const EJEMPLOS = {
      hola: `// Mi primer programa
Escribir "Hola mundo"`,

      saludo: `// Programa de saludo personalizado
Definir nombre Como Caracter
Escribir "¿Cómo te llamas?"
Leer nombre
Escribir "¡Hola, ", nombre, "! Bienvenido."  // saludo final`,

      notas: `// Calculadora de promedio de notas
Definir nota1 Como Real
Definir nota2 Como Real
Definir promedio Como Real

Escribir "Ingresa la primera nota:"
Leer nota1
Escribir "Ingresa la segunda nota:"
Leer nota2

promedio <- (nota1 + nota2) / 2  // calcula promedio

Escribir "El promedio es: ", promedio`,

      multivar: `// Ejemplo con múltiples variables en una línea
Definir nombre, apellido, ciudad Como Caracter
Definir edad Como Entero

Escribir "Ingresa tu nombre:"
Leer nombre
Escribir "Ingresa tu apellido:"
Leer apellido
Escribir "Ingresa tu ciudad:"
Leer ciudad
Escribir "Ingresa tu edad:"
Leer edad

// Mostrar resultados
Escribir "--- Datos ingresados ---"
Escribir "Nombre: ", nombre, " ", apellido
Escribir "Ciudad: ", ciudad
Escribir "Edad: ", edad`,
    };

    function cargarEjemplo(nombre) {
      if (EJEMPLOS[nombre]) {
        $('#editor').val(EJEMPLOS[nombre]);
        limpiarConsola();   // also invalidates error visuals
        actualizarLineas();
      }
    }

    // =========================================
    // 11. INIT
    // =========================================

    $(document).ready(function() {
      actualizarLineas();
      $('#btnEjecutar').on('click', ejecutar);
      $('#btnDetener').on('click', detener);
      $('#btnLimpiarConsola').on('click', limpiarConsola);
      $('#btnLimpiarTodo').on('click', limpiarTodo);
      $(document).on('click', '.example-btn', function() {
        cargarEjemplo($(this).data('ejemplo'));
      });
    });
  </script>
</body>
</html>
