<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiteSeInt — Intérprete de Pseudocódigo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ========== HEADER ========== -->
    <header class="app-header">
      <div class="app-logo">
        <div class="app-logo-icon">L</div>
        <div class="app-logo-text">Lite<span>SeInt</span></div>
      </div>
    </header>

    <!-- ========== TOOLBAR ========== -->
    <div class="toolbar">
      <div class="toolbar-center">
        <button class="btn-exec" id="btnEjecutar">▶ Ejecutar</button>
        <button class="btn-stop" id="btnDetener" style="display:none;">◼ Detener</button>
      </div>
      <div class="toolbar-right">
        <div class="status-indicator">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Listo</span>
        </div>
      </div>
    </div>

    <!-- ========== MAIN ========== -->
    <div class="main-container">
      <!-- Editor -->
      <div class="editor-panel">
        <div class="panel-header">
          <div class="panel-header-dot"></div>
            Editor
          <div class="console-header-actions">
            <button class="btn-console-clear" id="btnDescargar">↓ Descargar</button>
            <button class="btn-console-clear" id="btnLimpiarTodo">✕ Borrar</button>
          </div>
        </div>
        <div class="editor-wrapper">
          <div class="line-numbers" id="lineNumbers"></div>
          <div class="editor-code-area">
            <div class="editor-bg-layer"></div>
            <div class="indent-guide-layer" id="indentGuideLayer"></div>
            <div class="editor-line-overlays" id="lineOverlays"></div>
            <div class="error-decoration-layer" id="errorDecoLayer"></div>
            <div class="syntax-highlight-layer" id="syntaxLayer"></div>
            <textarea
              id="editor"
              spellcheck="false"
            ></textarea>
          </div>
          <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
        </div>
        <div class="example-bar">
          <span>Ejemplos:</span>
          <button class="example-btn" data-ejemplo="hola">Hola Mundo</button>
          <button class="example-btn" data-ejemplo="saludo">Saludo</button>
          <button class="example-btn" data-ejemplo="notas">Notas</button>
          <button class="example-btn" data-ejemplo="multivar">Multi-variable</button>
          <button class="example-btn" data-ejemplo="mayor">Mayor de dos</button>
          <button class="example-btn" data-ejemplo="contador">Contador</button>
          <button class="example-btn" data-ejemplo="tabla">Tabla</button>
          <button class="example-btn" data-ejemplo="diasemana">Dia de semana</button>
          <button class="example-btn" data-ejemplo="logico">Lógico</button>
          <button class="example-btn" data-ejemplo="numerico">Numérico</button>
          <button class="example-btn" data-ejemplo="texto">Texto</button>
        </div>
      </div>

      <!-- Consola -->
      <div class="console-panel">
        <div class="console-header">
          <div class="panel-header-dot" style="background: var(--info);"></div>
          Consola
          <div class="console-header-actions">
            <button class="btn-console-clear" id="btnLimpiarConsola">✕ Borrar</button>
          </div>
        </div>
        <div id="consola"></div>
      </div>
    </div>

    <!-- ========== FOOTER ========== -->
    <footer class="app-footer">
      Desarrollado con<span class="heart">♥</span>por
      <a href="https://github.com/ernestoleonidas" target="_blank" rel="noopener noreferrer" class="ps-1"> Ernesto Velásquez</a>
      <div class="app-version">v0.6.0</div>
    </footer>

  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/doc_errores.js"></script>
  <script src="js/LiteSeInt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
