<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiteSeInt — Intérprete de Pseudocódigo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ========== HEADER ========== -->
    <header class="app-header">
      <div class="app-logo">
        <div class="app-logo-icon">L</div>
        <div class="app-logo-text">Lite<span>SeInt</span></div>
      </div>
    </header>

    <!-- ========== TOOLBAR ========== -->
    <div class="toolbar">
      <div class="toolbar-center">
        <button class="btn-exec" id="btnEjecutar">▶ Ejecutar</button>
        <button class="btn-stop" id="btnDetener" style="display:none;">◼ Detener</button>
      </div>
      <div class="toolbar-right">
        <div class="status-indicator">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Listo</span>
        </div>
      </div>
    </div>

    <!-- ========== MAIN ========== -->
    <div class="main-container">
      <!-- Workspace: editor + console stacked -->
      <div class="workspace-column">
        <!-- Editor -->
        <div class="editor-panel">
          <div class="panel-header">
            <div class="panel-header-dot"></div>
              Editor
            <div class="console-header-actions">
              <select class="ejemplos-select" id="ejemplosSelect" aria-label="Cargar ejemplo">
                <option value="">Cargar ejemplo…</option>
                <optgroup label="Primeros programas">
                  <option value="hola">Hola Mundo</option>
                </optgroup>
                <optgroup label="Variables y entrada/salida">
                  <option value="saludo">Saludo</option>
                  <option value="multivar">Multi-variable</option>
                </optgroup>
                <optgroup label="Expresiones y funciones">
                  <option value="notas">Notas</option>
                  <option value="numerico">Numérico</option>
                  <option value="texto">Texto</option>
                </optgroup>
                <optgroup label="Condicionales">
                  <option value="mayor">Mayor de dos</option>
                  <option value="logico">Lógico</option>
                </optgroup>
                <optgroup label="Ciclos">
                  <option value="contador">Contador</option>
                  <option value="tabla">Tabla</option>
                </optgroup>
                <optgroup label="Segun">
                  <option value="diasemana">Día de semana</option>
                </optgroup>
              </select>
              <button class="btn-console-clear" id="btnDescargar">↓ Descargar</button>
              <button class="btn-console-clear" id="btnLimpiarTodo">✕ Borrar</button>
            </div>
          </div>
          <div class="editor-wrapper">
            <div class="line-numbers" id="lineNumbers"></div>
            <div class="editor-code-area">
              <div class="editor-bg-layer"></div>
              <div class="indent-guide-layer" id="indentGuideLayer"></div>
              <div class="editor-line-overlays" id="lineOverlays"></div>
              <div class="error-decoration-layer" id="errorDecoLayer"></div>
              <div class="syntax-highlight-layer" id="syntaxLayer"></div>
              <textarea
                id="editor"
                spellcheck="false"
              ></textarea>
            </div>
            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
          </div>
        </div>

        <!-- Resize handle -->
        <div class="console-resize-handle" id="consoleResizeHandle" role="separator" aria-orientation="horizontal" aria-label="Redimensionar consola" tabindex="0"></div>

        <!-- Consola -->
        <div class="console-panel" id="consolePanel">
          <div class="console-header">
            <div class="panel-header-dot" style="background: var(--info);"></div>
            Consola
            <div class="console-header-actions">
              <button class="btn-console-clear" id="btnLimpiarConsola">✕ Borrar</button>
            </div>
          </div>
          <div id="consola"></div>
        </div>
      </div>

      <!-- Learning panel (right) -->
      <aside class="learning-panel" id="learningPanel" aria-label="Ejercicios y ruta de aprendizaje">
        <div class="learning-panel-header">
          <div class="panel-header-dot" style="background: var(--warning);"></div>
          Ejercicios
          <button class="learning-panel-toggle" id="learningPanelToggle" aria-label="Mostrar u ocultar panel de ejercicios">▾</button>
        </div>
        <div class="learning-panel-body" id="learningPanelBody">
          <div class="ej-workspace">
            <div class="ej-list-column">
              <div class="ej-filters" id="ejFilters">
            <label class="ej-filter">
              <span>Nivel</span>
              <select id="ejFiltroNivel">
                <option value="">Todos</option>
              </select>
            </label>
            <label class="ej-filter">
              <span>Dificultad</span>
              <select id="ejFiltroDificultad">
                <option value="">Todas</option>
                <option value="basico">Básico</option>
                <option value="intermedio">Intermedio</option>
                <option value="avanzado">Avanzado</option>
              </select>
            </label>
            <label class="ej-filter">
              <span>Estado</span>
              <select id="ejFiltroEstado">
                <option value="">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="en-curso">En curso</option>
                <option value="completado">Completado</option>
              </select>
            </label>
          </div>
              <div class="ej-progress-summary" id="ejProgresoResumen"></div>
              <ul class="ej-list" id="ejList"></ul>
            </div>
            <div class="ej-detail-column">
              <div class="ej-detail" id="ejDetail">
            <p class="ej-detail-empty">
              Selecciona un ejercicio para ver su enunciado.
            </p>
          </div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- ========== FOOTER ========== -->
    <footer class="app-footer">
      Desarrollado con<span class="heart">♥</span>por
      <a href="https://github.com/ernestoleonidas" target="_blank" rel="noopener noreferrer" class="ps-1"> Ernesto Velásquez</a>
      <div class="app-version">v.0.8.3</div>
    </footer>

  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/doc_errores.js"></script>
  <script src="js/LiteSeInt.js"></script>
  <script src="js/ejercicios-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
